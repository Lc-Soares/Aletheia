name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # TODO antes do lançamento: fixar cada action pelo hash do commit, em vez da tag.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências (exatamente o package-lock.json, sem scripts)
        run: npm ci --ignore-scripts

      - name: Lint, tipos e testes
        run: npm run check

      - name: Auditoria de dependências
        run: npm audit --audit-level=high
