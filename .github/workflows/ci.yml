name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # TODO antes do lançamento: fixar cada action pelo hash do commit, em vez da tag.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A versão do pnpm vem do campo "packageManager" do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências (lockfile congelado, sem scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint, tipos e testes
        run: pnpm run check

      - name: Auditoria de dependências
        run: pnpm audit --audit-level=high
